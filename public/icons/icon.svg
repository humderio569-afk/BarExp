<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Midnight Obsidian Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="35%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Amber-Gold Core Gradient (Top / Upper Planes) -->
    <linearGradient id="facetGoldTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Warm Amber Radiant Facet -->
    <linearGradient id="facetAmberLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Deep Warm Copper Facet -->
    <linearGradient id="facetCopper" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Radiant Sunset Crimson Facet -->
    <linearGradient id="facetCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="55%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>

    <!-- Electric Rose Glow Facet -->
    <linearGradient id="facetRose" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Inner Floating Prism Gradient -->
    <linearGradient id="innerPrismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Outer Geometric Neon Ring -->
    <linearGradient id="borderNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- Soft Ambient Filter -->
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Specular Neon Edge Filter -->
    <filter id="neonEdge" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>

  <!-- Outer Geometric Accent Frame -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="none" stroke="url(#borderNeon)" stroke-width="4" stroke-opacity="0.8" filter="url(#neonEdge)"/>
  <rect x="32" y="32" width="448" height="448" rx="92" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12"/>

  <!-- Ambient Central Volumetric Glow -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" fill-opacity="0.15" filter="url(#ambientGlow)"/>
  <circle cx="256" cy="270" r="100" fill="#e11d48" fill-opacity="0.12" filter="url(#ambientGlow)"/>

  <!-- Geometric Polygonal Hexagonal Guides / Grid Accents -->
  <polygon points="256,92 398,174 398,338 256,420 114,338 114,174" 
           fill="none" 
           stroke="url(#borderNeon)" 
           stroke-width="1.5" 
           stroke-opacity="0.25" 
           stroke-dasharray="8 6"/>

  <!-- Pure Geometric Polyhedral Structure (Non-Representational / Abstract 3D Prism) -->
  <g transform="translate(0, 0)" filter="url(#neonEdge)">
    
    <!-- Top Left Upper Facet -->
    <polygon points="256,120 256,256 138,188 138,138" 
             fill="url(#facetAmberLight)" 
             stroke="#ffffff" 
             stroke-width="1" 
             stroke-opacity="0.4"/>

    <!-- Top Right Upper Facet -->
    <polygon points="256,120 374,138 374,188 256,256" 
             fill="url(#facetGoldTop)" 
             stroke="#ffffff" 
             stroke-width="1" 
             stroke-opacity="0.5"/>

    <!-- Right Flank Isometric Diamond -->
    <polygon points="374,188 374,324 256,392 256,256" 
             fill="url(#facetCrimson)" 
             stroke="#ffffff" 
             stroke-width="1" 
             stroke-opacity="0.3"/>

    <!-- Left Flank Isometric Diamond -->
    <polygon points="138,188 256,256 256,392 138,324" 
             fill="url(#facetCopper)" 
             stroke="#ffffff" 
             stroke-width="1" 
             stroke-opacity="0.3"/>

    <!-- Intersecting Geometric Isometric Ribbons / Inner Fold -->
    <!-- Inner Top Diamond Facet -->
    <polygon points="256,160 326,200 256,240 186,200" 
             fill="url(#facetGoldTop)" 
             stroke="#ffffff" 
             stroke-width="1.5" 
             stroke-opacity="0.8"/>

    <!-- Inner Bottom-Left Facet -->
    <polygon points="186,200 256,240 256,332 186,292" 
             fill="url(#facetRose)" 
             stroke="#ffffff" 
             stroke-width="1.5" 
             stroke-opacity="0.6"/>

    <!-- Inner Bottom-Right Facet -->
    <polygon points="256,240 326,200 326,292 256,332" 
             fill="url(#innerPrismGrad)" 
             stroke="#ffffff" 
             stroke-width="1.5" 
             stroke-opacity="0.7"/>

    <!-- Central Levitating Geometric Core (Inverted Isometric Octahedral Rhombus) -->
    <polygon points="256,210 290,230 256,290 222,230" 
             fill="#0b0f19" 
             stroke="url(#borderNeon)" 
             stroke-width="2.5" 
             stroke-linejoin="round"/>

    <polygon points="256,220 280,235 256,275 232,235" 
             fill="url(#facetGoldTop)" 
             stroke="#ffffff" 
             stroke-width="1"/>

    <!-- Geometric Intersection Bevel Lines (High Contrast Lighting) -->
    <line x1="256" y1="120" x2="256" y2="392" stroke="#ffffff" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round"/>
    <line x1="138" y1="188" x2="374" y2="324" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>
    <line x1="374" y1="188" x2="138" y2="324" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round"/>

    <!-- Geometric Apex Highlight Points (Precision Vertices) -->
    <circle cx="256" cy="120" r="4.5" fill="#ffffff" filter="url(#neonEdge)"/>
    <circle cx="374" cy="188" r="4" fill="#fef08a"/>
    <circle cx="374" cy="324" r="4" fill="#f43f5e"/>
    <circle cx="256" cy="392" r="4.5" fill="#f43f5e" filter="url(#neonEdge)"/>
    <circle cx="138" cy="324" r="4" fill="#f59e0b"/>
    <circle cx="138" cy="188" r="4" fill="#fef08a"/>
    <circle cx="256" cy="256" r="3.5" fill="#ffffff"/>
  </g>

  <!-- Dynamic Geometric Micro-Accents (Diamond Points) -->
  <polygon points="256,58 261,68 271,73 261,78 256,88 251,78 241,73 251,68" fill="#fef08a" opacity="0.8"/>
  <polygon points="256,424 260,432 268,436 260,440 256,448 252,440 244,436 252,432" fill="#f43f5e" opacity="0.8"/>
  <polygon points="82,256 90,260 94,268 90,276 82,280 74,276 70,268 74,260" fill="#f59e0b" opacity="0.6"/>
  <polygon points="430,256 438,260 442,268 438,276 430,280 422,276 418,268 422,260" fill="#fb7185" opacity="0.6"/>
</svg>
