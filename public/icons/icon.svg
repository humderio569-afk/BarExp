<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="50%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>

    <!-- Pill Container Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c30"/>
      <stop offset="40%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04070e"/>
    </linearGradient>

    <!-- Subtle Border Stroke Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Inner Highlight Glow -->
    <linearGradient id="topGleam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Pill -->
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle Background (For Android/iOS/PWA Home Screen) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Outer Accent Rim -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Centered BarExp Launcher Pill Badge (Matching User Uploaded Asset) -->
  <g filter="url(#pillShadow)">
    <!-- Pill Outer Shadow / Glow Rim -->
    <rect x="36" y="146" width="440" height="220" rx="110" fill="url(#pillGrad)" stroke="url(#borderGrad)" stroke-width="4"/>
    
    <!-- Top Subtle Glare Effect -->
    <rect x="42" y="152" width="428" height="104" rx="52" fill="url(#topGleam)"/>
  </g>

  <!-- High-Precision Crisp BarExp Bold Typography -->
  <g id="brand-text">
    <text 
      x="256" 
      y="282" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Montserrat', 'Helvetica Neue', Arial, sans-serif" 
      font-size="108" 
      font-weight="900" 
      letter-spacing="-3px" 
      fill="#ffffff" 
      text-anchor="middle"
      style="font-feature-settings: 'cv05', 'cv08', 'ss01'; text-rendering: geometricPrecision;"
    >BarExp</text>
  </g>
</svg>
